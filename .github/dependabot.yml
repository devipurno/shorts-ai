version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    target-branch: develop
    reviewers:
      - purnomodevi606
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Asia/Bangkok
    target-branch: develop
    reviewers:
      - purnomodevi606
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Bangkok
    target-branch: develop
    reviewers:
      - purnomodevi606
    open-pull-requests-limit: 5
