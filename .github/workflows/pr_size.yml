name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  size_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute diff size
        id: diff
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --stat "origin/${{ github.base_ref }}...HEAD" > diff-stat.txt
          ADDED=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" | awk '{a+=$1; d+=$2} END {print a+0}')
          DELETED=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" | awk '{a+=$1; d+=$2} END {print d+0}')
          TOTAL=$((ADDED + DELETED))
          if [ "$TOTAL" -gt 500 ]; then LABEL="size: XL"; elif [ "$TOTAL" -ge 100 ]; then LABEL="size: L"; else LABEL="size: M"; fi
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
      - name: Label PR and comment on large changes
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const label = '${{ steps.diff.outputs.label }}';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [label],
            });
            const total = Number('${{ steps.diff.outputs.total }}');
            if (total > 1000) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `Heads up: this PR changes ${total} lines (+${{ steps.diff.outputs.added }}/-${{ steps.diff.outputs.deleted }}). Please consider splitting if review feels heavy.`,
              });
            }
